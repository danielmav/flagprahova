<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 480" role="img" aria-labelledby="t">
  <title id="t">Pești și lacuri din Prahova</title>
  <defs>
    <clipPath id="cerc"><circle cx="380" cy="230" r="210"/></clipPath>
  </defs>

  <!-- Fundal: cercul deschis -->
  <circle cx="380" cy="230" r="210" fill="#E6EEF8"/>

  <!-- Dealurile și apa, decupate în cerc (fără muchii drepte peste gradientul paginii) -->
  <g clip-path="url(#cerc)">
    <path d="M170 300 Q250 200 330 270 Q400 330 470 250 Q540 180 590 260 L590 445 L170 445 Z" fill="#C9D8EE"/>
    <path d="M170 342 Q260 272 340 320 Q430 376 520 312 Q560 286 590 306 L590 445 L170 445 Z" fill="#B3C7E6"/>
    <path d="M160 348 C230 322 290 372 370 350 C450 328 500 372 600 348 L600 445 L160 445 Z" fill="#1F6FC5" opacity=".9"/>
    <path d="M160 404 C240 386 300 420 380 404 C460 388 520 420 600 402 L600 445 L160 445 Z" fill="#272B5C"/>
  </g>

  <!-- Pește care sare, deasupra apei -->
  <g transform="translate(424 238) rotate(-18) scale(.95)" fill="#272B5C">
    <path d="M-40 0 C-20 -26 20 -26 46 0 C20 26 -20 26 -40 0 Z"/>
    <path d="M-40 0 L-66 -20 L-58 0 L-66 20 Z"/>
    <path d="M-8 -20 L6 -33 L16 -22 Z"/>
    <circle cx="28" cy="-5" r="5" fill="#fff"/>
  </g>

  <!-- Pește portocaliu, spre dreapta -->
  <g transform="translate(300 372) scale(.8)" fill="#EC8C16">
    <path d="M-40 0 C-20 -26 20 -26 46 0 C20 26 -20 26 -40 0 Z"/>
    <path d="M-40 0 L-66 -20 L-58 0 L-66 20 Z"/>
    <path d="M-8 -20 L6 -33 L16 -22 Z"/>
    <circle cx="28" cy="-5" r="5" fill="#fff"/>
  </g>

  <!-- Pește alb, spre stânga -->
  <g transform="translate(470 366) scale(-.72 .72)" fill="#fff" stroke="#1F6FC5" stroke-width="4" stroke-linejoin="round">
    <path d="M-40 0 C-20 -26 20 -26 46 0 C20 26 -20 26 -40 0 Z"/>
    <path d="M-40 0 L-66 -20 L-58 0 L-66 20 Z"/>
    <path d="M-8 -20 L6 -33 L16 -22 Z"/>
    <circle cx="28" cy="-5" r="5" fill="#1F6FC5" stroke="none"/>
  </g>

  <!-- Cerculețe decorative -->
  <g fill="none">
    <circle cx="556" cy="112" r="13" stroke="#EC8C16" stroke-width="3"/>
    <circle cx="600" cy="162" r="6" stroke="#EC8C16" stroke-width="2.5"/>
    <circle cx="238" cy="118" r="9" stroke="#EC8C16" stroke-width="2.5"/>
    <circle cx="348" cy="418" r="8" stroke="#fff" stroke-width="2.5"/>
    <circle cx="418" cy="430" r="5" stroke="#fff" stroke-width="2"/>
  </g>
</svg>
